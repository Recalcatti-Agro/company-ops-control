# Entorno local para ver v2 con la base de desarrollo (backend/db.sqlite3).
# Uso: docker compose up -d --build  →  http://localhost:3010
services:
  backend:
    build: ./backend
    container_name: recalcatti-v2-backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8123"]
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3010,http://localhost:3000"
    volumes:
      - ./backend:/app
    ports:
      - "8123:8123"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8123/api"
    container_name: recalcatti-v2-frontend
    ports:
      - "3010:3010"
    depends_on:
      - backend

# Producción (AWS Lightsail). Usa el mismo .env del servidor que v1.
# Nombres de servicio/contenedor iguales a v1 para que scripts/backup_db_prod*.sh
# y el cron del backup diario sigan andando sin cambios.
#
# La base de v2 vive en el volumen postgres_v2_data. El volumen de v1
# (postgres_data) no se toca: volver a v1 = checkout de v1-final + up.
services:
  db:
    image: postgres:16
    container_name: business-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data

  web:
    build:
      context: ./backend
    container_name: business-web
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    container_name: business-frontend
    restart: unless-stopped
    depends_on:
      - web

  caddy:
    image: caddy:2
    container_name: business-caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - web

volumes:
  postgres_v2_data:
  caddy_data:
  caddy_config:
